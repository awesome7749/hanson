<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc"><title id="title">Frost clears. Heating resumes.</title><desc id="desc">A four-stage conceptual sequence: normal heating, brief defrost sends heat to the outdoor coil, meltwater drains, and heating resumes. Persistent ice or faults require investigation.</desc><rect width="760" height="560" rx="22" fill="#faf8f5"/><g font-family="Arial, sans-serif"><text x="28" y="37" fill="#65594b" font-size="18" text-anchor="start" font-weight="400">HANSON HOME  /  HEAT PUMPS, EXPLAINED</text><text x="28" y="85" fill="#302d29" font-size="32" text-anchor="start" font-weight="400">Defrost is part of winter operation.</text><rect x="28" y="146" width="338" height="148" rx="16" fill="#e8eff0" stroke="#d1c8b9"/><text x="53" y="191" fill="#302d29" font-size="32" text-anchor="start" font-weight="600">1</text><text x="53" y="224" fill="#302d29" font-size="23" text-anchor="start" font-weight="600">Heat the rooms</text><text x="53" y="254" fill="#65594b" font-size="20" text-anchor="start" font-weight="400">Outdoor coil</text><text x="53" y="283" fill="#65594b" font-size="20" text-anchor="start" font-weight="400">absorbs heat.</text><rect x="394" y="146" width="338" height="148" rx="16" fill="#f4e8db" stroke="#d1c8b9"/><text x="419" y="191" fill="#302d29" font-size="32" text-anchor="start" font-weight="600">2</text><text x="419" y="224" fill="#302d29" font-size="23" text-anchor="start" font-weight="600">Clear the frost</text><text x="419" y="254" fill="#65594b" font-size="20" text-anchor="start" font-weight="400">Heat briefly warms</text><text x="419" y="283" fill="#65594b" font-size="20" text-anchor="start" font-weight="400">the outdoor coil.</text><rect x="28" y="317" width="338" height="148" rx="16" fill="#e8eff0" stroke="#d1c8b9"/><text x="53" y="362" fill="#302d29" font-size="32" text-anchor="start" font-weight="600">3</text><text x="53" y="395" fill="#302d29" font-size="23" text-anchor="start" font-weight="600">Drain meltwater</text><text x="53" y="425" fill="#65594b" font-size="20" text-anchor="start" font-weight="400">Provide a safe</text><text x="53" y="454" fill="#65594b" font-size="20" text-anchor="start" font-weight="400">drainage path.</text><rect x="394" y="317" width="338" height="148" rx="16" fill="#e8eff0" stroke="#d1c8b9"/><text x="419" y="362" fill="#302d29" font-size="32" text-anchor="start" font-weight="600">4</text><text x="419" y="395" fill="#302d29" font-size="23" text-anchor="start" font-weight="600">Resume heating</text><text x="419" y="425" fill="#65594b" font-size="20" text-anchor="start" font-weight="400">The system returns</text><text x="419" y="454" fill="#65594b" font-size="20" text-anchor="start" font-weight="400">to room heating.</text><text x="28" y="538" fill="#65594b" font-size="17" text-anchor="start" font-weight="400">Original educational illustration · Hanson Home</text></g></svg>