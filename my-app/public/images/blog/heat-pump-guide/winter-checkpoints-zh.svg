<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" lang="zh-Hans" role="img" aria-labelledby="title desc"><title id="title">冬季检查点区分冰点结霜、17°F 和 5°F 数据，以及各型号零下限制。</title><desc id="desc">这些是不同温度应问的问题，不是性能曲线或全州统一设计温度。</desc><rect width="760" height="560" rx="22" fill="#faf8f5"/><g font-family="Arial, sans-serif"><text x="28" y="37" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">HANSON HOME / 热泵原理</text><text x="28" y="85" fill="#302d29" font-size="31.00" text-anchor="start" font-weight="400">把温度作为检查点。</text><rect x="28" y="145" width="338" height="148" rx="16" fill="#e8eff0" stroke="#d1c8b9"/><text x="48" y="195" fill="#302d29" font-size="32.00" text-anchor="start" font-weight="600">32°F</text><text x="48" y="227" fill="#302d29" font-size="20.00" text-anchor="start" font-weight="600">冰点</text><text x="48" y="257" fill="#65594b" font-size="19.00" text-anchor="start" font-weight="400">结霜与除霜</text><text x="48" y="285" fill="#65594b" font-size="18.39" text-anchor="start" font-weight="400">可能影响性能。</text><rect x="394" y="145" width="338" height="148" rx="16" fill="#f4e8db" stroke="#d1c8b9"/><text x="414" y="195" fill="#302d29" font-size="32.00" text-anchor="start" font-weight="600">17°F</text><text x="414" y="227" fill="#302d29" font-size="20.00" text-anchor="start" font-weight="600">低温数据</text><text x="414" y="257" fill="#65594b" font-size="19.00" text-anchor="start" font-weight="400">比较制热量</text><text x="414" y="285" fill="#65594b" font-size="19.00" text-anchor="start" font-weight="400">与效率。</text><rect x="28" y="315" width="338" height="148" rx="16" fill="#e8eff0" stroke="#d1c8b9"/><text x="48" y="365" fill="#302d29" font-size="32.00" text-anchor="start" font-weight="600">5°F</text><text x="48" y="397" fill="#302d29" font-size="20.00" text-anchor="start" font-weight="600">寒冷气候测试点</text><text x="48" y="427" fill="#65594b" font-size="19.00" text-anchor="start" font-weight="400">分别核实制热量</text><text x="48" y="455" fill="#65594b" font-size="19.00" text-anchor="start" font-weight="400">与 COP。</text><rect x="394" y="315" width="338" height="148" rx="16" fill="#f4e8db" stroke="#d1c8b9"/><text x="414" y="365" fill="#302d29" font-size="32.00" text-anchor="start" font-weight="600">&lt; 0°F</text><text x="414" y="397" fill="#302d29" font-size="20.00" text-anchor="start" font-weight="600">型号的具体限制</text><text x="414" y="427" fill="#65594b" font-size="19.00" text-anchor="start" font-weight="400">核实输出与</text><text x="414" y="455" fill="#65594b" font-size="19.00" text-anchor="start" font-weight="400">极寒策略。</text><text x="28" y="538" fill="#65594b" font-size="17.00" text-anchor="start" font-weight="400">原创教学图示 · Hanson Home</text></g></svg>