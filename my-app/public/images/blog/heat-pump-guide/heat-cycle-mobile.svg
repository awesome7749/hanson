<svg xmlns="http://www.w3.org/2000/svg" width="460" height="650" viewBox="0 0 460 650" lang="en" role="img" aria-labelledby="title desc"><title id="title">Air stays separate. Heat moves.</title><desc id="desc">Outside air and room air circulate on their own sides. A sealed refrigerant circuit absorbs heat outdoors, raises its temperature through compression, releases heat indoors and lowers pressure through expansion.</desc><rect width="460" height="650" rx="22" fill="#faf8f5"/><g font-family="Arial, sans-serif"><text x="28" y="37" fill="#65594b" font-size="16.00" text-anchor="start" font-weight="400">HANSON HOME  /  HEAT PUMPS, EXPLAINED</text><text x="28" y="81" fill="#302d29" font-size="29.00" text-anchor="start" font-weight="600">Air stays separate.</text><text x="28" y="116" fill="#302d29" font-size="29.00" text-anchor="start" font-weight="600">Heat moves.</text><rect x="28" y="146" width="404" height="138" rx="16" fill="#e8eff0" stroke="#d1c8b9"/><text x="52" y="183" fill="#326c86" font-size="21.00" text-anchor="start" font-weight="600">OUTDOORS</text><text x="52" y="219" fill="#65594b" font-size="21.00" text-anchor="start" font-weight="400">Outside air → outdoor coil</text><text x="52" y="249" fill="#65594b" font-size="21.00" text-anchor="start" font-weight="400">Refrigerant absorbs heat.</text><line x1="170" y1="294" x2="170" y2="365" stroke="#a34f2e" stroke-width="4"/><path d="M -10 -6 L 0 0 L -10 6" transform="translate(170 365) rotate(90)" fill="none" stroke="#a34f2e" stroke-width="4"/><text x="195" y="322" fill="#302d29" font-size="21.00" text-anchor="start" font-weight="400">Compressor</text><text x="195" y="349" fill="#65594b" font-size="19.00" text-anchor="start" font-weight="400">raises temperature</text><rect x="28" y="386" width="404" height="138" rx="16" fill="#f4e8db" stroke="#d1c8b9"/><text x="52" y="423" fill="#a34f2e" font-size="21.00" text-anchor="start" font-weight="600">YOUR HOME</text><text x="52" y="459" fill="#65594b" font-size="21.00" text-anchor="start" font-weight="400">Indoor coil → room air</text><text x="52" y="489" fill="#65594b" font-size="21.00" text-anchor="start" font-weight="400">Refrigerant releases heat.</text><text x="28" y="568" fill="#65594b" font-size="20.00" text-anchor="start" font-weight="400">Expansion lowers pressure;</text><text x="28" y="596" fill="#65594b" font-size="20.00" text-anchor="start" font-weight="400">refrigerant returns to the outdoor coil.</text><text x="28" y="628" fill="#65594b" font-size="15.00" text-anchor="start" font-weight="400">Original educational illustration · Hanson Home</text></g></svg>