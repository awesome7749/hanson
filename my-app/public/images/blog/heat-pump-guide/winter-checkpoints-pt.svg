<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" lang="pt-BR" role="img" aria-labelledby="title desc"><title id="title">Pontos de inverno distinguem congelamento e degelo, dados a 17°F e 5°F e limites negativos específicos.</title><desc id="desc">São perguntas para diferentes temperaturas, não uma curva de desempenho ou temperatura estadual de projeto.</desc><rect width="760" height="560" rx="22" fill="#faf8f5"/><g font-family="Arial, sans-serif"><text x="28" y="37" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">HANSON HOME / BOMBAS DE CALOR</text><text x="28" y="85" fill="#302d29" font-size="31.00" text-anchor="start" font-weight="400">Temperaturas: pontos de análise.</text><rect x="28" y="145" width="338" height="148" rx="16" fill="#e8eff0" stroke="#d1c8b9"/><text x="48" y="195" fill="#302d29" font-size="32.00" text-anchor="start" font-weight="600">32°F</text><text x="48" y="227" fill="#302d29" font-size="18.00" text-anchor="start" font-weight="600">Congelamento</text><text x="48" y="257" fill="#65594b" font-size="19.00" text-anchor="start" font-weight="400">Gelo e degelo</text><text x="48" y="285" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">podem importar.</text><rect x="394" y="145" width="338" height="148" rx="16" fill="#f4e8db" stroke="#d1c8b9"/><text x="414" y="195" fill="#302d29" font-size="32.00" text-anchor="start" font-weight="600">17°F</text><text x="414" y="227" fill="#302d29" font-size="20.00" text-anchor="start" font-weight="600">Dados no frio</text><text x="414" y="257" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">Compare capacidade</text><text x="414" y="285" fill="#65594b" font-size="19.00" text-anchor="start" font-weight="400">e eficiência.</text><rect x="28" y="315" width="338" height="148" rx="16" fill="#e8eff0" stroke="#d1c8b9"/><text x="48" y="365" fill="#302d29" font-size="32.00" text-anchor="start" font-weight="600">5°F</text><text x="48" y="397" fill="#302d29" font-size="20.00" text-anchor="start" font-weight="600">Teste de clima frio</text><text x="48" y="427" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">Confira capacidade</text><text x="48" y="455" fill="#65594b" font-size="19.00" text-anchor="start" font-weight="400">e COP separados.</text><rect x="394" y="315" width="338" height="148" rx="16" fill="#f4e8db" stroke="#d1c8b9"/><text x="414" y="365" fill="#302d29" font-size="32.00" text-anchor="start" font-weight="600">&lt; 0°F</text><text x="414" y="397" fill="#302d29" font-size="20.00" text-anchor="start" font-weight="600">Limites do modelo</text><text x="414" y="427" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">Verifique capacidade e</text><text x="414" y="455" fill="#65594b" font-size="18.62" text-anchor="start" font-weight="400">plano para frio extremo.</text><text x="28" y="538" fill="#65594b" font-size="17.00" text-anchor="start" font-weight="400">Ilustração educativa original · Hanson Home</text></g></svg>