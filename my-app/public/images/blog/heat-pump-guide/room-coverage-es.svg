<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" lang="es" role="img" aria-labelledby="title desc"><title id="title">Plano conceptual con sala y dormitorios cerrados como zonas distintas que necesitan calefacción.</title><desc id="desc">Distribución conceptual, no plano ni cálculo de un cliente. Cada habitación cerrada necesita una vía de calefacción documentada.</desc><rect width="760" height="560" rx="22" fill="#faf8f5"/><g font-family="Arial, sans-serif"><text x="28" y="37" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">HANSON HOME / BOMBAS DE CALOR</text><text x="28" y="85" fill="#302d29" font-size="27.97" text-anchor="start" font-weight="400">Las habitaciones también necesitan calor.</text><rect x="28" y="138" width="704" height="295" fill="#f4e8db" stroke="#302d29" stroke-width="5"/><rect x="401.12" y="138" width="330.88" height="295" fill="#e8eff0" stroke="none"/><line x1="401.12" y1="138" x2="401.12" y2="433" stroke="#302d29" stroke-width="5"/><line x1="401.12" y1="285.5" x2="732" y2="285.5" stroke="#302d29" stroke-width="5"/><rect x="48" y="162" width="333.12" height="37" rx="16" fill="white" stroke="#d1c8b9"/><text x="214.56" y="188" fill="#a34f2e" font-size="18.89" text-anchor="middle" font-weight="600">Unidad interior</text><text x="214.56" y="309.1" fill="#302d29" font-size="27.84" text-anchor="middle" font-weight="400">Sala de</text><text x="214.56" y="347.1" fill="#302d29" font-size="29.00" text-anchor="middle" font-weight="400">estar</text><text x="566.56" y="211.75" fill="#302d29" font-size="21.00" text-anchor="middle" font-weight="400">Dormitorio 1</text><text x="566.56" y="243.75" fill="#326c86" font-size="23.00" text-anchor="middle" font-weight="400">¿Recibe calor?</text><line x1="401.12" y1="186.75" x2="401.12" y2="236.75" stroke="#a34f2e" stroke-width="8"/><text x="566.56" y="359.25" fill="#302d29" font-size="21.00" text-anchor="middle" font-weight="400">Dormitorio 2</text><text x="566.56" y="391.25" fill="#326c86" font-size="23.00" text-anchor="middle" font-weight="400">¿Recibe calor?</text><line x1="401.12" y1="334.25" x2="401.12" y2="384.25" stroke="#a34f2e" stroke-width="8"/><text x="28" y="478" fill="#65594b" font-size="24.00" text-anchor="start" font-weight="400">El diseño incluye puertas cerradas.</text><text x="28" y="511" fill="#65594b" font-size="24.00" text-anchor="start" font-weight="400">No suponga que el pasillo calienta todo.</text><text x="28" y="538" fill="#65594b" font-size="17.00" text-anchor="start" font-weight="400">Ilustración educativa original · Hanson Home</text></g></svg>