<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" lang="en" role="img" aria-labelledby="title desc"><title id="title">Air stays separate. Heat moves.</title><desc id="desc">Outside air and room air circulate on their own sides. A sealed refrigerant circuit absorbs heat outdoors, raises its temperature through compression, releases heat indoors and lowers pressure through expansion.</desc><rect width="760" height="560" rx="22" fill="#faf8f5"/><g font-family="Arial, sans-serif"><text x="28" y="37" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">HANSON HOME  /  HEAT PUMPS, EXPLAINED</text><text x="28" y="88" fill="#302d29" font-size="32.00" text-anchor="start" font-weight="600">Air stays separate. Heat moves.</text><rect x="28" y="140" width="272" height="235" rx="16" fill="#e8eff0" stroke="#d1c8b9"/><rect x="460" y="140" width="272" height="235" rx="16" fill="#f4e8db" stroke="#d1c8b9"/><text x="164" y="183" fill="#326c86" font-size="24.00" text-anchor="middle" font-weight="600">OUTDOORS</text><text x="164" y="230" fill="#302d29" font-size="24.00" text-anchor="middle" font-weight="400">Outside air</text><text x="164" y="263" fill="#302d29" font-size="24.00" text-anchor="middle" font-weight="400">↓</text><text x="164" y="296" fill="#302d29" font-size="24.00" text-anchor="middle" font-weight="400">Outdoor coil</text><text x="164" y="329" fill="#302d29" font-size="24.00" text-anchor="middle" font-weight="400">absorbs heat</text><text x="596" y="183" fill="#a34f2e" font-size="24.00" text-anchor="middle" font-weight="600">YOUR HOME</text><text x="596" y="230" fill="#302d29" font-size="24.00" text-anchor="middle" font-weight="400">Indoor coil</text><text x="596" y="263" fill="#302d29" font-size="24.00" text-anchor="middle" font-weight="400">↓</text><text x="596" y="296" fill="#302d29" font-size="24.00" text-anchor="middle" font-weight="400">Room air</text><text x="596" y="329" fill="#302d29" font-size="24.00" text-anchor="middle" font-weight="400">receives heat</text><line x1="315" y1="205" x2="445" y2="205" stroke="#a34f2e" stroke-width="4"/><path d="M -10 -6 L 0 0 L -10 6" transform="translate(445 205) rotate(0)" fill="none" stroke="#a34f2e" stroke-width="4"/><text x="380" y="245" fill="#65594b" font-size="20.00" text-anchor="middle" font-weight="400">Compressor</text><text x="380" y="274" fill="#65594b" font-size="20.00" text-anchor="middle" font-weight="400">raises</text><text x="380" y="303" fill="#65594b" font-size="20.00" text-anchor="middle" font-weight="400">temperature</text><line x1="445" y1="348" x2="315" y2="348" stroke="#326c86" stroke-width="4"/><path d="M -10 -6 L 0 0 L -10 6" transform="translate(315 348) rotate(180)" fill="none" stroke="#326c86" stroke-width="4"/><text x="380" y="410" fill="#65594b" font-size="24.00" text-anchor="middle" font-weight="400">Expansion lowers pressure.</text><text x="380" y="443" fill="#65594b" font-size="24.00" text-anchor="middle" font-weight="400">Refrigerant returns to the outdoor coil.</text><text x="380" y="494" fill="#302d29" font-size="21.00" text-anchor="middle" font-weight="400">Heating mode · sealed refrigerant circuit</text><text x="28" y="538" fill="#65594b" font-size="17.00" text-anchor="start" font-weight="400">Original educational illustration · Hanson Home</text></g></svg>