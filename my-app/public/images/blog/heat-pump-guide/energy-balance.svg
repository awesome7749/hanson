<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc"><title id="title">One unit in. Three units delivered.</title><desc id="desc">Hypothetical COP 3 energy balance: one unit of electricity plus two units of outdoor heat equals three units of delivered indoor heat. Not a prediction for any equipment.</desc><rect width="760" height="560" rx="22" fill="#faf8f5"/><g font-family="Arial, sans-serif"><text x="28" y="37" fill="#65594b" font-size="18" text-anchor="start" font-weight="400">HANSON HOME  /  HEAT PUMPS, EXPLAINED</text><text x="28" y="85" fill="#302d29" font-size="32" text-anchor="start" font-weight="400">At COP 3, moving heat adds up.</text><rect x="28" y="163" width="218" height="210" rx="16" fill="#faf8f5" stroke="#d1c8b9"/><text x="137" y="256" fill="#302d29" font-size="64" text-anchor="middle" font-weight="600">1</text><text x="137" y="312" fill="#302d29" font-size="23" text-anchor="middle" font-weight="400">electricity</text><rect x="271" y="163" width="218" height="210" rx="16" fill="#e8eff0" stroke="#d1c8b9"/><text x="380" y="256" fill="#326c86" font-size="64" text-anchor="middle" font-weight="600">2</text><text x="380" y="312" fill="#326c86" font-size="23" text-anchor="middle" font-weight="400">outdoor heat</text><rect x="514" y="163" width="218" height="210" rx="16" fill="#f4e8db" stroke="#d1c8b9"/><text x="623" y="256" fill="#a34f2e" font-size="64" text-anchor="middle" font-weight="600">3</text><text x="623" y="312" fill="#a34f2e" font-size="23" text-anchor="middle" font-weight="400">delivered heat</text><text x="259" y="267" fill="#302d29" font-size="28" text-anchor="middle" font-weight="400">+</text><text x="502" y="267" fill="#302d29" font-size="28" text-anchor="middle" font-weight="400">=</text><text x="28" y="452" fill="#65594b" font-size="23" text-anchor="start" font-weight="400">Example only. Actual COP varies with conditions.</text><text x="28" y="538" fill="#65594b" font-size="17" text-anchor="start" font-weight="400">Original educational illustration · Hanson Home</text></g></svg>