<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" lang="es" role="img" aria-labelledby="title desc"><title id="title">Circuitos de aire exterior e interior separados, unidos por un circuito sellado de refrigerante.</title><desc id="desc">Cada corriente de aire permanece en su lado; el refrigerante transfiere calor. Cambie los modos en la versión interactiva.</desc><rect width="760" height="560" rx="22" fill="#faf8f5"/><g font-family="Arial, sans-serif"><text x="28" y="37" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">HANSON HOME / BOMBAS DE CALOR</text><text x="28" y="88" fill="#302d29" font-size="32.00" text-anchor="start" font-weight="600">Aire separado. El calor se mueve.</text><rect x="28" y="140" width="272" height="235" rx="16" fill="#e8eff0" stroke="#d1c8b9"/><rect x="460" y="140" width="272" height="235" rx="16" fill="#f4e8db" stroke="#d1c8b9"/><text x="164" y="183" fill="#326c86" font-size="24.00" text-anchor="middle" font-weight="600">EXTERIOR</text><text x="164" y="230" fill="#302d29" font-size="22.74" text-anchor="middle" font-weight="400">Aire exterior</text><text x="164" y="263" fill="#302d29" font-size="24.00" text-anchor="middle" font-weight="400">↓</text><text x="164" y="296" fill="#302d29" font-size="18.00" text-anchor="middle" font-weight="400">Serpentín exterior</text><text x="164" y="329" fill="#302d29" font-size="24.00" text-anchor="middle" font-weight="400">absorbe calor</text><text x="596" y="183" fill="#a34f2e" font-size="24.00" text-anchor="middle" font-weight="600">SU CASA</text><text x="596" y="230" fill="#302d29" font-size="18.00" text-anchor="middle" font-weight="400">Serpentín interior</text><text x="596" y="263" fill="#302d29" font-size="24.00" text-anchor="middle" font-weight="400">↓</text><text x="596" y="296" fill="#302d29" font-size="18.00" text-anchor="middle" font-weight="400">Aire interior</text><text x="596" y="329" fill="#302d29" font-size="24.00" text-anchor="middle" font-weight="400">recibe calor</text><line x1="315" y1="205" x2="445" y2="205" stroke="#a34f2e" stroke-width="4"/><path d="M -10 -6 L 0 0 L -10 6" transform="translate(445 205) rotate(0)" fill="none" stroke="#a34f2e" stroke-width="4"/><text x="380" y="245" fill="#65594b" font-size="20.00" text-anchor="middle" font-weight="400">Compresor</text><text x="380" y="274" fill="#65594b" font-size="20.00" text-anchor="middle" font-weight="400">eleva</text><text x="380" y="303" fill="#65594b" font-size="20.00" text-anchor="middle" font-weight="400">temperatura</text><line x1="445" y1="348" x2="315" y2="348" stroke="#326c86" stroke-width="4"/><path d="M -10 -6 L 0 0 L -10 6" transform="translate(315 348) rotate(180)" fill="none" stroke="#326c86" stroke-width="4"/><text x="380" y="410" fill="#65594b" font-size="24.00" text-anchor="middle" font-weight="400">La expansión baja la presión.</text><text x="380" y="443" fill="#65594b" font-size="24.00" text-anchor="middle" font-weight="400">Regresa al serpentín exterior.</text><text x="380" y="494" fill="#302d29" font-size="21.00" text-anchor="middle" font-weight="400">Calefacción · circuito sellado</text><text x="28" y="538" fill="#65594b" font-size="17.00" text-anchor="start" font-weight="400">Ilustración educativa original · Hanson Home</text></g></svg>