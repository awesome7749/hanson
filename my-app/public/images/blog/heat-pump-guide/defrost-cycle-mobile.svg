<svg xmlns="http://www.w3.org/2000/svg" width="460" height="650" viewBox="0 0 460 650" lang="en" role="img" aria-labelledby="title desc"><title id="title">Frost clears. Heating resumes.</title><desc id="desc">A four-stage conceptual sequence: normal heating, brief defrost sends heat to the outdoor coil, meltwater drains, and heating resumes. Persistent ice or faults require investigation.</desc><rect width="460" height="650" rx="22" fill="#faf8f5"/><g font-family="Arial, sans-serif"><text x="28" y="37" fill="#65594b" font-size="16.00" text-anchor="start" font-weight="400">HANSON HOME  /  HEAT PUMPS, EXPLAINED</text><text x="28" y="85" fill="#302d29" font-size="29.00" text-anchor="start" font-weight="400">Defrost is part</text><text x="28" y="123" fill="#302d29" font-size="29.00" text-anchor="start" font-weight="400">of winter operation.</text><rect x="28" y="146" width="404" height="96" rx="16" fill="#e8eff0" stroke="#d1c8b9"/><text x="53" y="201" fill="#302d29" font-size="32.00" text-anchor="start" font-weight="600">1</text><text x="105" y="176" fill="#302d29" font-size="22.00" text-anchor="start" font-weight="600">Heat the rooms</text><text x="105" y="203" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">Outdoor coil</text><text x="105" y="230" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">absorbs heat.</text><rect x="28" y="254" width="404" height="96" rx="16" fill="#f4e8db" stroke="#d1c8b9"/><text x="53" y="309" fill="#302d29" font-size="32.00" text-anchor="start" font-weight="600">2</text><text x="105" y="284" fill="#302d29" font-size="22.00" text-anchor="start" font-weight="600">Clear the frost</text><text x="105" y="311" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">Heat briefly warms</text><text x="105" y="338" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">the outdoor coil.</text><rect x="28" y="362" width="404" height="96" rx="16" fill="#e8eff0" stroke="#d1c8b9"/><text x="53" y="417" fill="#302d29" font-size="32.00" text-anchor="start" font-weight="600">3</text><text x="105" y="392" fill="#302d29" font-size="22.00" text-anchor="start" font-weight="600">Drain meltwater</text><text x="105" y="419" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">Provide a safe</text><text x="105" y="446" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">drainage path.</text><rect x="28" y="470" width="404" height="96" rx="16" fill="#e8eff0" stroke="#d1c8b9"/><text x="53" y="525" fill="#302d29" font-size="32.00" text-anchor="start" font-weight="600">4</text><text x="105" y="500" fill="#302d29" font-size="22.00" text-anchor="start" font-weight="600">Resume heating</text><text x="105" y="527" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">The system returns</text><text x="105" y="554" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">to room heating.</text><text x="28" y="628" fill="#65594b" font-size="15.00" text-anchor="start" font-weight="400">Original educational illustration · Hanson Home</text></g></svg>