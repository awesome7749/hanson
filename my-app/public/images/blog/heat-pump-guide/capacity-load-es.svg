206.6 353.34615384615387,194.4 722,182.20000000000002" fill="none" stroke="#3e6c59" stroke-width="4"/><polyline points="83,298.1 205.8846153846154,267.6 353.34615384615387,237.1 722,212.70000000000002" fill="none" stroke="#a34f2e" stroke-width="4" stroke-dasharray="8 5"/><text x="83" y="444" fill="#302d29" font-size="18.00" text-anchor="middle" font-weight="400">-5°F</text><text x="205.8846153846154" y="444" fill="#302d29" font-size="18.00" text-anchor="middle" font-weight="400">5°F</text><text x="353.34615384615387" y="444" fill="#302d29" font-size="18.00" text-anchor="middle" font-weight="400">17°F</text><text x="722" y="444" fill="#302d29" font-size="18.00" text-anchor="middle" font-weight="400">47°F</text><circle cx="205.8846153846154" cy="206.6" r="6" fill="#3e6c59"/><circle cx="205.8846153846154" cy="231" r="6" fill="#302d29"/><circle cx="205.8846153846154" cy="267.6" r="6" fill="#a34f2e"/><text x="83" y="474" fill="#65594b" font-size="19.00" text-anchor="start" font-weight="400">← más frío afuera</text><line x1="28" y1="491" x2="46" y2="491" stroke="#302d29" stroke-width="4"/><text x="54" y="497" fill="#302d29" font-size="20.00" text-anchor="start" font-weight="400">Carga: 30k</text><line x1="270" y1="491" x2="288" y2="491" stroke="#3e6c59" stroke-width="4"/><text x="296" y="497" fill="#3e6c59" font-size="20.00" text-anchor="start" font-weight="400">Sistema A: 34k</text><line x1="512" y1="491" x2="530" y2="491" stroke="#a34f2e" stroke-width="4"/><text x="538" y="497" fill="#a34f2e" font-size="20.00" text-anchor="start" font-weight="400">Sistema B: 24k</text><text x="83" y="126" fill="#65594b" font-size="20.00" text-anchor="start" font-weight="400">Ejemplo de diseño: 5°F</text><text x="28" y="538" fill="#65594b" font-size="17.00" text-anchor="start" font-weight="400">Ilustración educativa original · Hanson Home</text></g></svg>