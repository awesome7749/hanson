<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" lang="pt-BR" role="img" aria-labelledby="title desc"><title id="title">No exemplo COP 3, uma unidade de eletricidade mais duas de calor externo equivalem a três de calor entregue.</title><desc id="desc">Balanço ilustrativo com COP 3. O COP real varia com clima, condições e sistema instalado.</desc><rect width="760" height="560" rx="22" fill="#faf8f5"/><g font-family="Arial, sans-serif"><text x="28" y="37" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">HANSON HOME / BOMBAS DE CALOR</text><text x="28" y="85" fill="#302d29" font-size="32.00" text-anchor="start" font-weight="400">Com COP 3, o calor se soma.</text><rect x="28" y="163" width="218" height="210" rx="16" fill="#faf8f5" stroke="#d1c8b9"/><text x="137" y="256" fill="#302d29" font-size="64.00" text-anchor="middle" font-weight="600">1</text><text x="137" y="312" fill="#302d29" font-size="23.00" text-anchor="middle" font-weight="400">eletricidade</text><rect x="271" y="163" width="218" height="210" rx="16" fill="#e8eff0" stroke="#d1c8b9"/><text x="380" y="256" fill="#326c86" font-size="64.00" text-anchor="middle" font-weight="600">2</text><text x="380" y="312" fill="#326c86" font-size="23.00" text-anchor="middle" font-weight="400">calor externo</text><rect x="514" y="163" width="218" height="210" rx="16" fill="#f4e8db" stroke="#d1c8b9"/><text x="623" y="256" fill="#a34f2e" font-size="64.00" text-anchor="middle" font-weight="600">3</text><text x="623" y="312" fill="#a34f2e" font-size="23.00" text-anchor="middle" font-weight="400">calor entregue</text><text x="259" y="267" fill="#302d29" font-size="28.00" text-anchor="middle" font-weight="400">+</text><text x="502" y="267" fill="#302d29" font-size="28.00" text-anchor="middle" font-weight="400">=</text><text x="28" y="452" fill="#65594b" font-size="23.00" text-anchor="start" font-weight="400">Exemplo. COP varia com as condições.</text><text x="28" y="538" fill="#65594b" font-size="17.00" text-anchor="start" font-weight="400">Ilustração educativa original · Hanson Home</text></g></svg>