<svg xmlns="http://www.w3.org/2000/svg" width="460" height="650" viewBox="0 0 460 650" lang="es" role="img" aria-labelledby="title desc"><title id="title">Calefacción normal, deshielo breve del serpentín exterior, drenaje y regreso a calefacción.</title><desc id="desc">El deshielo es una fase breve. El hielo persistente o la recuperación deficiente requieren investigación.</desc><rect width="460" height="650" rx="22" fill="#faf8f5"/><g font-family="Arial, sans-serif"><text x="28" y="37" fill="#65594b" font-size="16.00" text-anchor="start" font-weight="400">HANSON HOME / BOMBAS DE CALOR</text><text x="28" y="85" fill="#302d29" font-size="28.66" text-anchor="start" font-weight="400">El deshielo forma</text><text x="28" y="123" fill="#302d29" font-size="29.00" text-anchor="start" font-weight="400">parte del invierno.</text><rect x="28" y="146" width="404" height="96" rx="16" fill="#e8eff0" stroke="#d1c8b9"/><text x="53" y="201" fill="#302d29" font-size="32.00" text-anchor="start" font-weight="600">1</text><text x="105" y="176" fill="#302d29" font-size="21.56" text-anchor="start" font-weight="600">Calentar la casa</text><text x="105" y="203" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">Serpentín exterior</text><text x="105" y="230" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">absorbe calor.</text><rect x="28" y="254" width="404" height="96" rx="16" fill="#f4e8db" stroke="#d1c8b9"/><text x="53" y="309" fill="#302d29" font-size="32.00" text-anchor="start" font-weight="600">2</text><text x="105" y="284" fill="#302d29" font-size="21.74" text-anchor="start" font-weight="600">Eliminar escarcha</text><text x="105" y="311" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">El calor calienta</text><text x="105" y="338" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">el serpentín exterior.</text><rect x="28" y="362" width="404" height="96" rx="16" fill="#e8eff0" stroke="#d1c8b9"/><text x="53" y="417" fill="#302d29" font-size="32.00" text-anchor="start" font-weight="600">3</text><text x="105" y="392" fill="#302d29" font-size="22.00" text-anchor="start" font-weight="600">Drenar el agua</text><text x="105" y="419" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">Prever una vía</text><text x="105" y="446" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">segura de drenaje.</text><rect x="28" y="470" width="404" height="96" rx="16" fill="#e8eff0" stroke="#d1c8b9"/><text x="53" y="525" fill="#302d29" font-size="32.00" text-anchor="start" font-weight="600">4</text><text x="105" y="500" fill="#302d29" font-size="22.00" text-anchor="start" font-weight="600">Reanudar calor</text><text x="105" y="527" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">El sistema vuelve</text><text x="105" y="554" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">a calentar la casa.</text><text x="28" y="628" fill="#65594b" font-size="15.00" text-anchor="start" font-weight="400">Ilustración educativa original · Hanson Home</text></g></svg>