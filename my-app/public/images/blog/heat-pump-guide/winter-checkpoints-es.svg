<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" lang="es" role="img" aria-labelledby="title desc"><title id="title">Puntos de revisión invernal: congelación y deshielo, datos a 17°F y 5°F y límites bajo cero de cada modelo.</title><desc id="desc">Son preguntas para distintas temperaturas, no una curva de rendimiento ni una temperatura de diseño estatal.</desc><rect width="760" height="560" rx="22" fill="#faf8f5"/><g font-family="Arial, sans-serif"><text x="28" y="37" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">HANSON HOME / BOMBAS DE CALOR</text><text x="28" y="85" fill="#302d29" font-size="31.00" text-anchor="start" font-weight="400">Temperaturas: puntos de revisión.</text><rect x="28" y="145" width="338" height="148" rx="16" fill="#e8eff0" stroke="#d1c8b9"/><text x="48" y="195" fill="#302d29" font-size="32.00" text-anchor="start" font-weight="600">32°F</text><text x="48" y="227" fill="#302d29" font-size="18.00" text-anchor="start" font-weight="600">Congelación</text><text x="48" y="257" fill="#65594b" font-size="19.00" text-anchor="start" font-weight="400">Escarcha y deshielo</text><text x="48" y="285" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">pueden importar.</text><rect x="394" y="145" width="338" height="148" rx="16" fill="#f4e8db" stroke="#d1c8b9"/><text x="414" y="195" fill="#302d29" font-size="32.00" text-anchor="start" font-weight="600">17°F</text><text x="414" y="227" fill="#302d29" font-size="20.00" text-anchor="start" font-weight="600">Datos en frío</text><text x="414" y="257" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">Compare capacidad</text><text x="414" y="285" fill="#65594b" font-size="19.00" text-anchor="start" font-weight="400">y eficiencia.</text><rect x="28" y="315" width="338" height="148" rx="16" fill="#e8eff0" stroke="#d1c8b9"/><text x="48" y="365" fill="#302d29" font-size="32.00" text-anchor="start" font-weight="600">5°F</text><text x="48" y="397" fill="#302d29" font-size="20.00" text-anchor="start" font-weight="600">Prueba de clima frío</text><text x="48" y="427" fill="#65594b" font-size="18.62" text-anchor="start" font-weight="400">Revise capacidad</text><text x="48" y="455" fill="#65594b" font-size="19.00" text-anchor="start" font-weight="400">y COP por separado.</text><rect x="394" y="315" width="338" height="148" rx="16" fill="#f4e8db" stroke="#d1c8b9"/><text x="414" y="365" fill="#302d29" font-size="32.00" text-anchor="start" font-weight="600">&lt; 0°F</text><text x="414" y="397" fill="#302d29" font-size="20.00" text-anchor="start" font-weight="600">Límites del modelo</text><text x="414" y="427" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">Verifique capacidad y</text><text x="414" y="455" fill="#65594b" font-size="19.00" text-anchor="start" font-weight="400">plan para frío extremo.</text><text x="28" y="538" fill="#65594b" font-size="17.00" text-anchor="start" font-weight="400">Ilustración educativa original · Hanson Home</text></g></svg>