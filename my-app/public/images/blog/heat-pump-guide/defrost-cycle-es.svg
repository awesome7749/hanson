<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" lang="es" role="img" aria-labelledby="title desc"><title id="title">Calefacción normal, deshielo breve del serpentín exterior, drenaje y regreso a calefacción.</title><desc id="desc">El deshielo es una fase breve. El hielo persistente o la recuperación deficiente requieren investigación.</desc><rect width="760" height="560" rx="22" fill="#faf8f5"/><g font-family="Arial, sans-serif"><text x="28" y="37" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">HANSON HOME / BOMBAS DE CALOR</text><text x="28" y="85" fill="#302d29" font-size="32.00" text-anchor="start" font-weight="400">El deshielo forma parte del invierno.</text><rect x="28" y="146" width="338" height="148" rx="16" fill="#e8eff0" stroke="#d1c8b9"/><text x="53" y="191" fill="#302d29" font-size="32.00" text-anchor="start" font-weight="600">1</text><text x="53" y="224" fill="#302d29" font-size="22.54" text-anchor="start" font-weight="600">Calentar la casa</text><text x="53" y="254" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">Serpentín exterior</text><text x="53" y="283" fill="#65594b" font-size="20.00" text-anchor="start" font-weight="400">absorbe calor.</text><rect x="394" y="146" width="338" height="148" rx="16" fill="#f4e8db" stroke="#d1c8b9"/><text x="419" y="191" fill="#302d29" font-size="32.00" text-anchor="start" font-weight="600">2</text><text x="419" y="224" fill="#302d29" font-size="22.73" text-anchor="start" font-weight="600">Eliminar escarcha</text><text x="419" y="254" fill="#65594b" font-size="20.00" text-anchor="start" font-weight="400">El calor calienta</text><text x="419" y="283" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">el serpentín exterior.</text><rect x="28" y="317" width="338" height="148" rx="16" fill="#e8eff0" stroke="#d1c8b9"/><text x="53" y="362" fill="#302d29" font-size="32.00" text-anchor="start" font-weight="600">3</text><text x="53" y="395" fill="#302d29" font-size="23.00" text-anchor="start" font-weight="600">Drenar el agua</text><text x="53" y="425" fill="#65594b" font-size="20.00" text-anchor="start" font-weight="400">Prever una vía</text><text x="53" y="454" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">segura de drenaje.</text><rect x="394" y="317" width="338" height="148" rx="16" fill="#e8eff0" stroke="#d1c8b9"/><text x="419" y="362" fill="#302d29" font-size="32.00" text-anchor="start" font-weight="600">4</text><text x="419" y="395" fill="#302d29" font-size="23.00" text-anchor="start" font-weight="600">Reanudar calor</text><text x="419" y="425" fill="#65594b" font-size="20.00" text-anchor="start" font-weight="400">El sistema vuelve</text><text x="419" y="454" fill="#65594b" font-size="18.86" text-anchor="start" font-weight="400">a calentar la casa.</text><text x="28" y="538" fill="#65594b" font-size="17.00" text-anchor="start" font-weight="400">Ilustración educativa original · Hanson Home</text></g></svg>