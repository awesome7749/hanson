<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" lang="zh-Hans" role="img" aria-labelledby="title desc"><title id="title">正常制热、短时室外除霜、融水排放、恢复制热的顺序。</title><desc id="desc">除霜是短时阶段；持续冰冻或恢复不良应调查原因，不能一概视为正常。</desc><rect width="760" height="560" rx="22" fill="#faf8f5"/><g font-family="Arial, sans-serif"><text x="28" y="37" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">HANSON HOME / 热泵原理</text><text x="28" y="85" fill="#302d29" font-size="32.00" text-anchor="start" font-weight="400">除霜属于冬季运行的一部分。</text><rect x="28" y="146" width="338" height="148" rx="16" fill="#e8eff0" stroke="#d1c8b9"/><text x="53" y="191" fill="#302d29" font-size="32.00" text-anchor="start" font-weight="600">1</text><text x="53" y="224" fill="#302d29" font-size="23.00" text-anchor="start" font-weight="600">为房间供暖</text><text x="53" y="254" fill="#65594b" font-size="20.00" text-anchor="start" font-weight="400">室外换热器</text><text x="53" y="283" fill="#65594b" font-size="20.00" text-anchor="start" font-weight="400">吸收热量。</text><rect x="394" y="146" width="338" height="148" rx="16" fill="#f4e8db" stroke="#d1c8b9"/><text x="419" y="191" fill="#302d29" font-size="32.00" text-anchor="start" font-weight="600">2</text><text x="419" y="224" fill="#302d29" font-size="23.00" text-anchor="start" font-weight="600">清除霜层</text><text x="419" y="254" fill="#65594b" font-size="20.00" text-anchor="start" font-weight="400">热量短暂加热</text><text x="419" y="283" fill="#65594b" font-size="20.00" text-anchor="start" font-weight="400">室外换热器。</text><rect x="28" y="317" width="338" height="148" rx="16" fill="#e8eff0" stroke="#d1c8b9"/><text x="53" y="362" fill="#302d29" font-size="32.00" text-anchor="start" font-weight="600">3</text><text x="53" y="395" fill="#302d29" font-size="23.00" text-anchor="start" font-weight="600">排出融水</text><text x="53" y="425" fill="#65594b" font-size="20.00" text-anchor="start" font-weight="400">提供安全的</text><text x="53" y="454" fill="#65594b" font-size="20.00" text-anchor="start" font-weight="400">排水路径。</text><rect x="394" y="317" width="338" height="148" rx="16" fill="#e8eff0" stroke="#d1c8b9"/><text x="419" y="362" fill="#302d29" font-size="32.00" text-anchor="start" font-weight="600">4</text><text x="419" y="395" fill="#302d29" font-size="23.00" text-anchor="start" font-weight="600">恢复制热</text><text x="419" y="425" fill="#65594b" font-size="20.00" text-anchor="start" font-weight="400">系统恢复</text><text x="419" y="454" fill="#65594b" font-size="20.00" text-anchor="start" font-weight="400">房间供暖。</text><text x="28" y="538" fill="#65594b" font-size="17.00" text-anchor="start" font-weight="400">原创教学图示 · Hanson Home</text></g></svg>