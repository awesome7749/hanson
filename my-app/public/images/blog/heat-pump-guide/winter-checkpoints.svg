<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc"><title id="title">Four winter checkpoints, four questions.</title><desc id="desc">Freezing: assess frost and defrost. 17°F: compare low-temperature output. 5°F: check cold-climate qualification and capacity. Below zero: verify exact model operating limits and the extreme-weather strategy.</desc><rect width="760" height="560" rx="22" fill="#faf8f5"/><g font-family="Arial, sans-serif"><text x="28" y="37" fill="#65594b" font-size="18" text-anchor="start" font-weight="400">HANSON HOME  /  HEAT PUMPS, EXPLAINED</text><text x="28" y="85" fill="#302d29" font-size="31" text-anchor="start" font-weight="400">Read the temperatures as checkpoints.</text><rect x="28" y="145" width="338" height="148" rx="16" fill="#e8eff0" stroke="#d1c8b9"/><text x="48" y="195" fill="#302d29" font-size="32" text-anchor="start" font-weight="600">32°F</text><text x="48" y="227" fill="#302d29" font-size="20" text-anchor="start" font-weight="600">Freezing</text><text x="48" y="257" fill="#65594b" font-size="19" text-anchor="start" font-weight="400">Frost and defrost</text><text x="48" y="285" fill="#65594b" font-size="19" text-anchor="start" font-weight="400">can matter.</text><rect x="394" y="145" width="338" height="148" rx="16" fill="#f4e8db" stroke="#d1c8b9"/><text x="414" y="195" fill="#302d29" font-size="32" text-anchor="start" font-weight="600">17°F</text><text x="414" y="227" fill="#302d29" font-size="20" text-anchor="start" font-weight="600">Low-temperature data</text><text x="414" y="257" fill="#65594b" font-size="19" text-anchor="start" font-weight="400">Compare output</text><text x="414" y="285" fill="#65594b" font-size="19" text-anchor="start" font-weight="400">and efficiency.</text><rect x="28" y="315" width="338" height="148" rx="16" fill="#e8eff0" stroke="#d1c8b9"/><text x="48" y="365" fill="#302d29" font-size="32" text-anchor="start" font-weight="600">5°F</text><text x="48" y="397" fill="#302d29" font-size="20" text-anchor="start" font-weight="600">Cold-climate test point</text><text x="48" y="427" fill="#65594b" font-size="19" text-anchor="start" font-weight="400">Check capacity</text><text x="48" y="455" fill="#65594b" font-size="19" text-anchor="start" font-weight="400">and COP separately.</text><rect x="394" y="315" width="338" height="148" rx="16" fill="#f4e8db" stroke="#d1c8b9"/><text x="414" y="365" fill="#302d29" font-size="32" text-anchor="start" font-weight="600">&lt; 0°F</text><text x="414" y="397" fill="#302d29" font-size="20" text-anchor="start" font-weight="600">Model-specific limits</text><text x="414" y="427" fill="#65594b" font-size="19" text-anchor="start" font-weight="400">Verify output and</text><text x="414" y="455" fill="#65594b" font-size="19" text-anchor="start" font-weight="400">extreme-weather plan.</text><text x="28" y="538" fill="#65594b" font-size="17" text-anchor="start" font-weight="400">Original educational illustration · Hanson Home</text></g></svg>