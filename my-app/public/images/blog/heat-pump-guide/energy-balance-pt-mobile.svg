<svg xmlns="http://www.w3.org/2000/svg" width="460" height="650" viewBox="0 0 460 650" lang="pt-BR" role="img" aria-labelledby="title desc"><title id="title">No exemplo COP 3, uma unidade de eletricidade mais duas de calor externo equivalem a três de calor entregue.</title><desc id="desc">Balanço ilustrativo com COP 3. O COP real varia com clima, condições e sistema instalado.</desc><rect width="460" height="650" rx="22" fill="#faf8f5"/><g font-family="Arial, sans-serif"><text x="28" y="37" fill="#65594b" font-size="16.00" text-anchor="start" font-weight="400">HANSON HOME / BOMBAS DE CALOR</text><text x="28" y="85" fill="#302d29" font-size="29.00" text-anchor="start" font-weight="400">Com COP 3:</text><text x="28" y="123" fill="#302d29" font-size="29.00" text-anchor="start" font-weight="400">o calor se soma.</text><rect x="28" y="155" width="404" height="110" rx="16" fill="#faf8f5" stroke="#d1c8b9"/><text x="86" y="223" fill="#302d29" font-size="52.00" text-anchor="middle" font-weight="600">1</text><text x="153" y="219" fill="#302d29" font-size="24.00" text-anchor="start" font-weight="400">eletricidade</text><rect x="28" y="287" width="404" height="110" rx="16" fill="#e8eff0" stroke="#d1c8b9"/><text x="86" y="355" fill="#326c86" font-size="52.00" text-anchor="middle" font-weight="600">2</text><text x="153" y="351" fill="#326c86" font-size="24.00" text-anchor="start" font-weight="400">calor externo</text><rect x="28" y="419" width="404" height="110" rx="16" fill="#f4e8db" stroke="#d1c8b9"/><text x="86" y="487" fill="#a34f2e" font-size="52.00" text-anchor="middle" font-weight="600">3</text><text x="153" y="483" fill="#a34f2e" font-size="24.00" text-anchor="start" font-weight="400">calor entregue</text><text x="230" y="284" fill="#302d29" font-size="26.00" text-anchor="middle" font-weight="400">+</text><text x="230" y="416" fill="#302d29" font-size="26.00" text-anchor="middle" font-weight="400">=</text><text x="28" y="574" fill="#65594b" font-size="19.00" text-anchor="start" font-weight="400">Exemplo. COP varia com as condições.</text><text x="28" y="628" fill="#65594b" font-size="15.00" text-anchor="start" font-weight="400">Ilustração educativa original · Hanson Home</text></g></svg>