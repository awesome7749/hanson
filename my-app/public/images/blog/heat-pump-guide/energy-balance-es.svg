<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" lang="es" role="img" aria-labelledby="title desc"><title id="title">Con COP 3 ilustrativo, una unidad de electricidad más dos de calor exterior equivalen a tres de calor entregado.</title><desc id="desc">Ejemplo de balance energético con COP 3. El COP real cambia según el clima, las condiciones y el sistema instalado.</desc><rect width="760" height="560" rx="22" fill="#faf8f5"/><g font-family="Arial, sans-serif"><text x="28" y="37" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">HANSON HOME / BOMBAS DE CALOR</text><text x="28" y="85" fill="#302d29" font-size="32.00" text-anchor="start" font-weight="400">Con COP 3, el calor se suma.</text><rect x="28" y="163" width="218" height="210" rx="16" fill="#faf8f5" stroke="#d1c8b9"/><text x="137" y="256" fill="#302d29" font-size="64.00" text-anchor="middle" font-weight="600">1</text><text x="137" y="312" fill="#302d29" font-size="23.00" text-anchor="middle" font-weight="400">electricidad</text><rect x="271" y="163" width="218" height="210" rx="16" fill="#e8eff0" stroke="#d1c8b9"/><text x="380" y="256" fill="#326c86" font-size="64.00" text-anchor="middle" font-weight="600">2</text><text x="380" y="312" fill="#326c86" font-size="22.08" text-anchor="middle" font-weight="400">calor exterior</text><rect x="514" y="163" width="218" height="210" rx="16" fill="#f4e8db" stroke="#d1c8b9"/><text x="623" y="256" fill="#a34f2e" font-size="64.00" text-anchor="middle" font-weight="600">3</text><text x="623" y="312" fill="#a34f2e" font-size="23.00" text-anchor="middle" font-weight="400">calor entregado</text><text x="259" y="267" fill="#302d29" font-size="28.00" text-anchor="middle" font-weight="400">+</text><text x="502" y="267" fill="#302d29" font-size="28.00" text-anchor="middle" font-weight="400">=</text><text x="28" y="452" fill="#65594b" font-size="23.00" text-anchor="start" font-weight="400">Ejemplo. El COP cambia con las condiciones.</text><text x="28" y="538" fill="#65594b" font-size="17.00" text-anchor="start" font-weight="400">Ilustración educativa original · Hanson Home</text></g></svg>