-width="4"/><polyline points="64,246.4 132.84615384615387,240.20000000000002 215.46153846153845,227.79999999999998 422,215.4" fill="none" stroke="#3e6c59" stroke-width="4"/><polyline points="64,333.2 132.84615384615387,302.20000000000005 215.46153846153845,271.20000000000005 422,246.4" fill="none" stroke="#a34f2e" stroke-width="4" stroke-dasharray="8 5"/><text x="64" y="481" fill="#302d29" font-size="18.00" text-anchor="middle" font-weight="400">-5°F</text><text x="132.84615384615387" y="481" fill="#302d29" font-size="18.00" text-anchor="middle" font-weight="400">5°F</text><text x="215.46153846153845" y="481" fill="#302d29" font-size="18.00" text-anchor="middle" font-weight="400">17°F</text><text x="422" y="481" fill="#302d29" font-size="18.00" text-anchor="middle" font-weight="400">47°F</text><circle cx="132.84615384615387" cy="240.20000000000002" r="6" fill="#3e6c59"/><circle cx="132.84615384615387" cy="265" r="6" fill="#302d29"/><circle cx="132.84615384615387" cy="302.20000000000005" r="6" fill="#a34f2e"/><text x="64" y="511" fill="#65594b" font-size="19.00" text-anchor="start" font-weight="400">← mais frio fora</text><line x1="28" y1="541" x2="46" y2="541" stroke="#302d29" stroke-width="4"/><text x="54" y="547" fill="#302d29" font-size="18.00" text-anchor="start" font-weight="400">Carga: 30k</text><line x1="28" y1="565" x2="46" y2="565" stroke="#3e6c59" stroke-width="4"/><text x="54" y="571" fill="#3e6c59" font-size="18.00" text-anchor="start" font-weight="400">Sistema A: 34k</text><line x1="28" y1="589" x2="46" y2="589" stroke="#a34f2e" stroke-width="4"/><text x="54" y="595" fill="#a34f2e" font-size="18.00" text-anchor="start" font-weight="400">Sistema B: 24k</text><text x="422" y="159" fill="#65594b" font-size="17.00" text-anchor="end" font-weight="400">Exemplo de projeto: 5°F</text><text x="28" y="628" fill="#65594b" font-size="15.00" text-anchor="start" font-weight="400">Ilustração educativa original · Hanson Home</text></g></svg>