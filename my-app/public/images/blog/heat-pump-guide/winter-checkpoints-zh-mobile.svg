<svg xmlns="http://www.w3.org/2000/svg" width="460" height="650" viewBox="0 0 460 650" lang="zh-Hans" role="img" aria-labelledby="title desc"><title id="title">冬季检查点区分冰点结霜、17°F 和 5°F 数据，以及各型号零下限制。</title><desc id="desc">这些是不同温度应问的问题，不是性能曲线或全州统一设计温度。</desc><rect width="460" height="650" rx="22" fill="#faf8f5"/><g font-family="Arial, sans-serif"><text x="28" y="37" fill="#65594b" font-size="16.00" text-anchor="start" font-weight="400">HANSON HOME / 热泵原理</text><text x="28" y="85" fill="#302d29" font-size="28.00" text-anchor="start" font-weight="400">把温度作为</text><text x="28" y="122" fill="#302d29" font-size="28.00" text-anchor="start" font-weight="400">检查点。</text><rect x="28" y="145" width="404" height="98" rx="16" fill="#e8eff0" stroke="#d1c8b9"/><text x="48" y="200" fill="#302d29" font-size="28.00" text-anchor="start" font-weight="600">32°F</text><text x="147" y="176" fill="#302d29" font-size="18.00" text-anchor="start" font-weight="600">冰点</text><text x="147" y="204" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">结霜与除霜</text><text x="147" y="231" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">可能影响性能。</text><rect x="28" y="254" width="404" height="98" rx="16" fill="#f4e8db" stroke="#d1c8b9"/><text x="48" y="309" fill="#302d29" font-size="28.00" text-anchor="start" font-weight="600">17°F</text><text x="147" y="285" fill="#302d29" font-size="18.00" text-anchor="start" font-weight="600">低温数据</text><text x="147" y="313" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">比较制热量</text><text x="147" y="340" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">与效率。</text><rect x="28" y="363" width="404" height="98" rx="16" fill="#e8eff0" stroke="#d1c8b9"/><text x="48" y="418" fill="#302d29" font-size="28.00" text-anchor="start" font-weight="600">5°F</text><text x="147" y="394" fill="#302d29" font-size="18.00" text-anchor="start" font-weight="600">寒冷气候测试点</text><text x="147" y="422" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">分别核实制热量</text><text x="147" y="449" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">与 COP。</text><rect x="28" y="472" width="404" height="98" rx="16" fill="#f4e8db" stroke="#d1c8b9"/><text x="48" y="527" fill="#302d29" font-size="28.00" text-anchor="start" font-weight="600">&lt; 0°F</text><text x="147" y="503" fill="#302d29" font-size="18.00" text-anchor="start" font-weight="600">型号的具体限制</text><text x="147" y="531" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">核实输出与</text><text x="147" y="558" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">极寒策略。</text><text x="28" y="628" fill="#65594b" font-size="15.00" text-anchor="start" font-weight="400">原创教学图示 · Hanson Home</text></g></svg>