<svg xmlns="http://www.w3.org/2000/svg" width="460" height="650" viewBox="0 0 460 650" lang="pt-BR" role="img" aria-labelledby="title desc"><title id="title">Planta conceitual separa sala e quartos fechados como zonas que exigem distribuição de calor.</title><desc id="desc">Não é planta ou cálculo de cliente. Quartos fechados precisam de uma rota de aquecimento documentada.</desc><rect width="460" height="650" rx="22" fill="#faf8f5"/><g font-family="Arial, sans-serif"><text x="28" y="37" fill="#65594b" font-size="16.00" text-anchor="start" font-weight="400">HANSON HOME / BOMBAS DE CALOR</text><text x="28" y="85" fill="#302d29" font-size="29.00" text-anchor="start" font-weight="400">Cômodos fechados</text><text x="28" y="123" fill="#302d29" font-size="19.49" text-anchor="start" font-weight="400">também precisam de calor.</text><rect x="28" y="155" width="404" height="360" fill="#f4e8db" stroke="#302d29" stroke-width="5"/><rect x="242.12" y="155" width="189.88" height="360" fill="#e8eff0" stroke="none"/><line x1="242.12" y1="155" x2="242.12" y2="515" stroke="#302d29" stroke-width="5"/><line x1="242.12" y1="335" x2="432" y2="335" stroke="#302d29" stroke-width="5"/><rect x="48" y="179" width="174.12" height="37" rx="16" fill="white" stroke="#d1c8b9"/><text x="135.06" y="205" fill="#a34f2e" font-size="18.00" text-anchor="middle" font-weight="600">Unidade interna</text><text x="135.06" y="363.79999999999995" fill="#302d29" font-size="23.00" text-anchor="middle" font-weight="400">Área</text><text x="135.06" y="395.79999999999995" fill="#302d29" font-size="23.00" text-anchor="middle" font-weight="400">social</text><text x="337.06" y="245" fill="#302d29" font-size="20.00" text-anchor="middle" font-weight="400">Quarto 1</text><text x="337.06" y="277" fill="#326c86" font-size="18.00" text-anchor="middle" font-weight="400">Recebe calor?</text><line x1="242.12" y1="220" x2="242.12" y2="270" stroke="#a34f2e" stroke-width="8"/><text x="337.06" y="425" fill="#302d29" font-size="20.00" text-anchor="middle" font-weight="400">Quarto 2</text><text x="337.06" y="457" fill="#326c86" font-size="18.00" text-anchor="middle" font-weight="400">Recebe calor?</text><line x1="242.12" y1="400" x2="242.12" y2="450" stroke="#a34f2e" stroke-width="8"/><text x="28" y="560" fill="#65594b" font-size="20.00" text-anchor="start" font-weight="400">O projeto inclui portas fechadas.</text><text x="28" y="589" fill="#65594b" font-size="20.00" text-anchor="start" font-weight="400">Calor do corredor não garante</text><text x="28" y="618" fill="#65594b" font-size="20.00" text-anchor="start" font-weight="400">a demanda de cada cômodo.</text><text x="28" y="628" fill="#65594b" font-size="15.00" text-anchor="start" font-weight="400">Ilustração educativa original · Hanson Home</text></g></svg>