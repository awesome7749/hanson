<svg xmlns="http://www.w3.org/2000/svg" width="460" height="650" viewBox="0 0 460 650" lang="zh-Hans" role="img" aria-labelledby="title desc"><title id="title">示例 COP 3：一份电能加两份室外热量，等于三份输出热量。</title><desc id="desc">COP 3 的能量平衡示例。实际 COP 随天气、工况和安装系统变化。</desc><rect width="460" height="650" rx="22" fill="#faf8f5"/><g font-family="Arial, sans-serif"><text x="28" y="37" fill="#65594b" font-size="16.00" text-anchor="start" font-weight="400">HANSON HOME / 热泵原理</text><text x="28" y="85" fill="#302d29" font-size="25.12" text-anchor="start" font-weight="400">COP 为 3 时：</text><text x="28" y="123" fill="#302d29" font-size="29.00" text-anchor="start" font-weight="400">输入与输出相加。</text><rect x="28" y="155" width="404" height="110" rx="16" fill="#faf8f5" stroke="#d1c8b9"/><text x="86" y="223" fill="#302d29" font-size="52.00" text-anchor="middle" font-weight="600">1</text><text x="153" y="219" fill="#302d29" font-size="24.00" text-anchor="start" font-weight="400">电能</text><rect x="28" y="287" width="404" height="110" rx="16" fill="#e8eff0" stroke="#d1c8b9"/><text x="86" y="355" fill="#326c86" font-size="52.00" text-anchor="middle" font-weight="600">2</text><text x="153" y="351" fill="#326c86" font-size="24.00" text-anchor="start" font-weight="400">室外热量</text><rect x="28" y="419" width="404" height="110" rx="16" fill="#f4e8db" stroke="#d1c8b9"/><text x="86" y="487" fill="#a34f2e" font-size="52.00" text-anchor="middle" font-weight="600">3</text><text x="153" y="483" fill="#a34f2e" font-size="24.00" text-anchor="start" font-weight="400">输出热量</text><text x="230" y="284" fill="#302d29" font-size="26.00" text-anchor="middle" font-weight="400">+</text><text x="230" y="416" fill="#302d29" font-size="26.00" text-anchor="middle" font-weight="400">=</text><text x="28" y="574" fill="#65594b" font-size="19.00" text-anchor="start" font-weight="400">仅为示例，实际 COP 随工况变化。</text><text x="28" y="628" fill="#65594b" font-size="15.00" text-anchor="start" font-weight="400">原创教学图示 · Hanson Home</text></g></svg>