<svg xmlns="http://www.w3.org/2000/svg" width="460" height="650" viewBox="0 0 460 650" lang="zh-Hans" role="img" aria-labelledby="title desc"><title id="title">相互分离的室内外空气循环，由密闭制冷剂回路连接。</title><desc id="desc">空气各自在自己的区域循环；制冷剂传递热量。可在互动版本切换模式。</desc><rect width="460" height="650" rx="22" fill="#faf8f5"/><g font-family="Arial, sans-serif"><text x="28" y="37" fill="#65594b" font-size="16.00" text-anchor="start" font-weight="400">HANSON HOME / 热泵原理</text><text x="28" y="81" fill="#302d29" font-size="29.00" text-anchor="start" font-weight="600">空气各自循环，</text><text x="28" y="116" fill="#302d29" font-size="28.07" text-anchor="start" font-weight="600">热量跨区传递。</text><rect x="28" y="146" width="404" height="138" rx="16" fill="#e8eff0" stroke="#d1c8b9"/><text x="52" y="183" fill="#326c86" font-size="21.00" text-anchor="start" font-weight="600">室外</text><text x="52" y="219" fill="#65594b" font-size="21.00" text-anchor="start" font-weight="400">室外空气 → 室外换热器</text><text x="52" y="249" fill="#65594b" font-size="21.00" text-anchor="start" font-weight="400">制冷剂吸收热量。</text><line x1="170" y1="294" x2="170" y2="365" stroke="#a34f2e" stroke-width="4"/><path d="M -10 -6 L 0 0 L -10 6" transform="translate(170 365) rotate(90)" fill="none" stroke="#a34f2e" stroke-width="4"/><text x="195" y="322" fill="#302d29" font-size="21.00" text-anchor="start" font-weight="400">压缩机</text><text x="195" y="349" fill="#65594b" font-size="19.00" text-anchor="start" font-weight="400">提高温度</text><rect x="28" y="386" width="404" height="138" rx="16" fill="#f4e8db" stroke="#d1c8b9"/><text x="52" y="423" fill="#a34f2e" font-size="21.00" text-anchor="start" font-weight="600">您的住宅</text><text x="52" y="459" fill="#65594b" font-size="21.00" text-anchor="start" font-weight="400">室内换热器 → 室内空气</text><text x="52" y="489" fill="#65594b" font-size="21.00" text-anchor="start" font-weight="400">制冷剂释放热量。</text><text x="28" y="568" fill="#65594b" font-size="20.00" text-anchor="start" font-weight="400">膨胀使压力降低；</text><text x="28" y="596" fill="#65594b" font-size="20.00" text-anchor="start" font-weight="400">制冷剂返回室外换热器。</text><text x="28" y="628" fill="#65594b" font-size="15.00" text-anchor="start" font-weight="400">原创教学图示 · Hanson Home</text></g></svg>