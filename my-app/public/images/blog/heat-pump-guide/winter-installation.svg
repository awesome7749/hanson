<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc"><title id="title">Plan the outdoor location for winter.</title><desc id="desc">Conceptual unit siting: required airflow stays open, roof runoff is controlled, the unit is supported above expected snow and meltwater has a safe drainage path. Dimensions are site- and manufacturer-specific.</desc><rect width="760" height="560" rx="22" fill="#faf8f5"/><g font-family="Arial, sans-serif"><text x="28" y="37" fill="#65594b" font-size="18" text-anchor="start" font-weight="400">HANSON HOME  /  HEAT PUMPS, EXPLAINED</text><text x="28" y="85" fill="#302d29" font-size="32" text-anchor="start" font-weight="400">Give winter air some room to move.</text><rect x="257" y="194" width="245" height="145" rx="16" fill="white" stroke="#d1c8b9"/><circle cx="367.25" cy="266.5" r="47" fill="#e8eff0" stroke="#326c86" stroke-width="3"/><path d="M 367.25 266.5 q 40 -25 37 -42 q -30 -8 -37 42" fill="#326c86" transform="rotate(0 367.25 266.5)"/><path d="M 367.25 266.5 q 40 -25 37 -42 q -30 -8 -37 42" fill="#326c86" transform="rotate(90 367.25 266.5)"/><path d="M 367.25 266.5 q 40 -25 37 -42 q -30 -8 -37 42" fill="#326c86" transform="rotate(180 367.25 266.5)"/><path d="M 367.25 266.5 q 40 -25 37 -42 q -30 -8 -37 42" fill="#326c86" transform="rotate(270 367.25 266.5)"/><line x1="272" y1="339" x2="272" y2="384" stroke="#302d29" stroke-width="5"/><line x1="487" y1="339" x2="487" y2="384" stroke="#302d29" stroke-width="5"/><line x1="28" y1="396" x2="732" y2="396" stroke="#d1c8b9" stroke-width="5"/><line x1="517" y1="249" x2="559" y2="249" stroke="#326c86" stroke-width="4"/><path d="M -10 -6 L 0 0 L -10 6" transform="translate(559 249) rotate(0)" fill="none" stroke="#326c86" stroke-width="4"/><line x1="239" y1="284" x2="195" y2="284" stroke="#326c86" stroke-width="4"/><path d="M -10 -6 L 0 0 L -10 6" transform="translate(195 284) rotate(180)" fill="none" stroke="#326c86" stroke-width="4"/><text x="28" y="156" fill="#65594b" font-size="24" text-anchor="start" font-weight="400">Keep roof runoff away</text><text x="28" y="419" fill="#65594b" font-size="24" text-anchor="start" font-weight="400">Keep airflow open. Mount for site snow accumulation.</text><text x="28" y="452" fill="#65594b" font-size="24" text-anchor="start" font-weight="400">Plan drainage and leave access for service.</text><text x="28" y="538" fill="#65594b" font-size="17" text-anchor="start" font-weight="400">Original educational illustration · Hanson Home</text></g></svg>