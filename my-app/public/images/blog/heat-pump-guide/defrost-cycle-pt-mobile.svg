<svg xmlns="http://www.w3.org/2000/svg" width="460" height="650" viewBox="0 0 460 650" lang="pt-BR" role="img" aria-labelledby="title desc"><title id="title">Aquecimento normal, degelo breve externo, drenagem e retorno ao aquecimento.</title><desc id="desc">Degelo é uma fase breve. Gelo persistente ou recuperação ruim exigem investigação.</desc><rect width="460" height="650" rx="22" fill="#faf8f5"/><g font-family="Arial, sans-serif"><text x="28" y="37" fill="#65594b" font-size="16.00" text-anchor="start" font-weight="400">HANSON HOME / BOMBAS DE CALOR</text><text x="28" y="85" fill="#302d29" font-size="29.00" text-anchor="start" font-weight="400">Degelo faz parte</text><text x="28" y="123" fill="#302d29" font-size="28.24" text-anchor="start" font-weight="400">da operação no inverno.</text><rect x="28" y="146" width="404" height="96" rx="16" fill="#e8eff0" stroke="#d1c8b9"/><text x="53" y="201" fill="#302d29" font-size="32.00" text-anchor="start" font-weight="600">1</text><text x="105" y="176" fill="#302d29" font-size="22.00" text-anchor="start" font-weight="600">Aquecer a casa</text><text x="105" y="203" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">Serpentina externa</text><text x="105" y="230" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">absorve calor.</text><rect x="28" y="254" width="404" height="96" rx="16" fill="#f4e8db" stroke="#d1c8b9"/><text x="53" y="309" fill="#302d29" font-size="32.00" text-anchor="start" font-weight="600">2</text><text x="105" y="284" fill="#302d29" font-size="22.00" text-anchor="start" font-weight="600">Remover gelo</text><text x="105" y="311" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">O calor aquece</text><text x="105" y="338" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">a serpentina externa.</text><rect x="28" y="362" width="404" height="96" rx="16" fill="#e8eff0" stroke="#d1c8b9"/><text x="53" y="417" fill="#302d29" font-size="32.00" text-anchor="start" font-weight="600">3</text><text x="105" y="392" fill="#302d29" font-size="22.00" text-anchor="start" font-weight="600">Drenar a água</text><text x="105" y="419" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">Prever uma rota</text><text x="105" y="446" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">segura de drenagem.</text><rect x="28" y="470" width="404" height="96" rx="16" fill="#e8eff0" stroke="#d1c8b9"/><text x="53" y="525" fill="#302d29" font-size="32.00" text-anchor="start" font-weight="600">4</text><text x="105" y="500" fill="#302d29" font-size="18.16" text-anchor="start" font-weight="600">Retomar aquecimento</text><text x="105" y="527" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">O sistema volta</text><text x="105" y="554" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">a aquecer a casa.</text><text x="28" y="628" fill="#65594b" font-size="15.00" text-anchor="start" font-weight="400">Ilustração educativa original · Hanson Home</text></g></svg>