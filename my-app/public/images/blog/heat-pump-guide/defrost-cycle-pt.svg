<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" lang="pt-BR" role="img" aria-labelledby="title desc"><title id="title">Aquecimento normal, degelo breve externo, drenagem e retorno ao aquecimento.</title><desc id="desc">Degelo é uma fase breve. Gelo persistente ou recuperação ruim exigem investigação.</desc><rect width="760" height="560" rx="22" fill="#faf8f5"/><g font-family="Arial, sans-serif"><text x="28" y="37" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">HANSON HOME / BOMBAS DE CALOR</text><text x="28" y="85" fill="#302d29" font-size="32.00" text-anchor="start" font-weight="400">Degelo faz parte do inverno.</text><rect x="28" y="146" width="338" height="148" rx="16" fill="#e8eff0" stroke="#d1c8b9"/><text x="53" y="191" fill="#302d29" font-size="32.00" text-anchor="start" font-weight="600">1</text><text x="53" y="224" fill="#302d29" font-size="23.00" text-anchor="start" font-weight="600">Aquecer a casa</text><text x="53" y="254" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">Serpentina externa</text><text x="53" y="283" fill="#65594b" font-size="20.00" text-anchor="start" font-weight="400">absorve calor.</text><rect x="394" y="146" width="338" height="148" rx="16" fill="#f4e8db" stroke="#d1c8b9"/><text x="419" y="191" fill="#302d29" font-size="32.00" text-anchor="start" font-weight="600">2</text><text x="419" y="224" fill="#302d29" font-size="23.00" text-anchor="start" font-weight="600">Remover gelo</text><text x="419" y="254" fill="#65594b" font-size="20.00" text-anchor="start" font-weight="400">O calor aquece</text><text x="419" y="283" fill="#65594b" font-size="18.13" text-anchor="start" font-weight="400">a serpentina externa.</text><rect x="28" y="317" width="338" height="148" rx="16" fill="#e8eff0" stroke="#d1c8b9"/><text x="53" y="362" fill="#302d29" font-size="32.00" text-anchor="start" font-weight="600">3</text><text x="53" y="395" fill="#302d29" font-size="23.00" text-anchor="start" font-weight="600">Drenar a água</text><text x="53" y="425" fill="#65594b" font-size="20.00" text-anchor="start" font-weight="400">Prever uma rota</text><text x="53" y="454" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">segura de drenagem.</text><rect x="394" y="317" width="338" height="148" rx="16" fill="#e8eff0" stroke="#d1c8b9"/><text x="419" y="362" fill="#302d29" font-size="32.00" text-anchor="start" font-weight="600">4</text><text x="419" y="395" fill="#302d29" font-size="18.98" text-anchor="start" font-weight="600">Retomar aquecimento</text><text x="419" y="425" fill="#65594b" font-size="20.00" text-anchor="start" font-weight="400">O sistema volta</text><text x="419" y="454" fill="#65594b" font-size="20.00" text-anchor="start" font-weight="400">a aquecer a casa.</text><text x="28" y="538" fill="#65594b" font-size="17.00" text-anchor="start" font-weight="400">Ilustração educativa original · Hanson Home</text></g></svg>