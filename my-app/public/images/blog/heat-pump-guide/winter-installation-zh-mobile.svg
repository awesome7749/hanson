<svg xmlns="http://www.w3.org/2000/svg" width="460" height="650" viewBox="0 0 460 650" lang="zh-Hans" role="img" aria-labelledby="title desc"><title id="title">示意室外机保留积雪空间、空气通路、屋顶径流控制与安全融水排放。</title><desc id="desc">冬季安装须考虑空气、积雪、屋顶水流和排水。确切高度与间距取决于厂家和场地。</desc><rect width="460" height="650" rx="22" fill="#faf8f5"/><g font-family="Arial, sans-serif"><text x="28" y="37" fill="#65594b" font-size="16.00" text-anchor="start" font-weight="400">HANSON HOME / 热泵原理</text><text x="28" y="85" fill="#302d29" font-size="29.00" text-anchor="start" font-weight="400">给冬季空气</text><text x="28" y="123" fill="#302d29" font-size="29.00" text-anchor="start" font-weight="400">留出流动空间。</text><rect x="128" y="249" width="202" height="145" rx="16" fill="white" stroke="#d1c8b9"/><circle cx="218.9" cy="321.5" r="47" fill="#e8eff0" stroke="#326c86" stroke-width="3"/><path d="M 218.9 321.5 q 40 -25 37 -42 q -30 -8 -37 42" fill="#326c86" transform="rotate(0 218.9 321.5)"/><path d="M 218.9 321.5 q 40 -25 37 -42 q -30 -8 -37 42" fill="#326c86" transform="rotate(90 218.9 321.5)"/><path d="M 218.9 321.5 q 40 -25 37 -42 q -30 -8 -37 42" fill="#326c86" transform="rotate(180 218.9 321.5)"/><path d="M 218.9 321.5 q 40 -25 37 -42 q -30 -8 -37 42" fill="#326c86" transform="rotate(270 218.9 321.5)"/><line x1="143" y1="394" x2="143" y2="439" stroke="#302d29" stroke-width="5"/><line x1="315" y1="394" x2="315" y2="439" stroke="#302d29" stroke-width="5"/><line x1="28" y1="451" x2="432" y2="451" stroke="#d1c8b9" stroke-width="5"/><line x1="345" y1="304" x2="387" y2="304" stroke="#326c86" stroke-width="4"/><path d="M -10 -6 L 0 0 L -10 6" transform="translate(387 304) rotate(0)" fill="none" stroke="#326c86" stroke-width="4"/><line x1="110" y1="339" x2="66" y2="339" stroke="#326c86" stroke-width="4"/><path d="M -10 -6 L 0 0 L -10 6" transform="translate(66 339) rotate(180)" fill="none" stroke="#326c86" stroke-width="4"/><text x="28" y="187" fill="#65594b" font-size="21.00" text-anchor="start" font-weight="400">避开屋顶径流</text><text x="28" y="471" fill="#65594b" font-size="20.00" text-anchor="start" font-weight="400">• 保持厂家规定的空气间距。</text><text x="28" y="500" fill="#65594b" font-size="20.00" text-anchor="start" font-weight="400">• 安装高度应考虑当地积雪。</text><text x="28" y="529" fill="#65594b" font-size="20.00" text-anchor="start" font-weight="400">• 提供安全的融水排放路径。</text><text x="28" y="558" fill="#65594b" font-size="20.00" text-anchor="start" font-weight="400">• 留出检修通道。</text><text x="28" y="628" fill="#65594b" font-size="15.00" text-anchor="start" font-weight="400">原创教学图示 · Hanson Home</text></g></svg>