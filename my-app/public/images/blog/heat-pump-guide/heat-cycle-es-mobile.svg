<svg xmlns="http://www.w3.org/2000/svg" width="460" height="650" viewBox="0 0 460 650" lang="es" role="img" aria-labelledby="title desc"><title id="title">Circuitos de aire exterior e interior separados, unidos por un circuito sellado de refrigerante.</title><desc id="desc">Cada corriente de aire permanece en su lado; el refrigerante transfiere calor. Cambie los modos en la versión interactiva.</desc><rect width="460" height="650" rx="22" fill="#faf8f5"/><g font-family="Arial, sans-serif"><text x="28" y="37" fill="#65594b" font-size="16.00" text-anchor="start" font-weight="400">HANSON HOME / BOMBAS DE CALOR</text><text x="28" y="81" fill="#302d29" font-size="29.00" text-anchor="start" font-weight="600">El aire se separa.</text><text x="28" y="116" fill="#302d29" font-size="19.85" text-anchor="start" font-weight="600">El calor se mueve.</text><rect x="28" y="146" width="404" height="138" rx="16" fill="#e8eff0" stroke="#d1c8b9"/><text x="52" y="183" fill="#326c86" font-size="21.00" text-anchor="start" font-weight="600">EXTERIOR</text><text x="52" y="219" fill="#65594b" font-size="21.00" text-anchor="start" font-weight="400">Aire → serpentín exterior</text><text x="52" y="249" fill="#65594b" font-size="19.60" text-anchor="start" font-weight="400">El refrigerante absorbe calor.</text><line x1="170" y1="294" x2="170" y2="365" stroke="#a34f2e" stroke-width="4"/><path d="M -10 -6 L 0 0 L -10 6" transform="translate(170 365) rotate(90)" fill="none" stroke="#a34f2e" stroke-width="4"/><text x="195" y="322" fill="#302d29" font-size="21.00" text-anchor="start" font-weight="400">Compresor</text><text x="195" y="349" fill="#65594b" font-size="19.00" text-anchor="start" font-weight="400">eleva la temperatura</text><rect x="28" y="386" width="404" height="138" rx="16" fill="#f4e8db" stroke="#d1c8b9"/><text x="52" y="423" fill="#a34f2e" font-size="21.00" text-anchor="start" font-weight="600">SU CASA</text><text x="52" y="459" fill="#65594b" font-size="20.70" text-anchor="start" font-weight="400">Serpentín interior → aire</text><text x="52" y="489" fill="#65594b" font-size="21.00" text-anchor="start" font-weight="400">El refrigerante libera calor.</text><text x="28" y="568" fill="#65594b" font-size="20.00" text-anchor="start" font-weight="400">La expansión baja la presión;</text><text x="28" y="596" fill="#65594b" font-size="20.00" text-anchor="start" font-weight="400">regresa al serpentín exterior.</text><text x="28" y="628" fill="#65594b" font-size="15.00" text-anchor="start" font-weight="400">Ilustración educativa original · Hanson Home</text></g></svg>