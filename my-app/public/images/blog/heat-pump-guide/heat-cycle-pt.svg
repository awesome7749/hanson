<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" lang="pt-BR" role="img" aria-labelledby="title desc"><title id="title">Circuitos de ar externo e interno separados, ligados por um circuito selado de refrigerante.</title><desc id="desc">O ar permanece em seu lado; o refrigerante transfere calor. Alterne os modos na versão interativa.</desc><rect width="760" height="560" rx="22" fill="#faf8f5"/><g font-family="Arial, sans-serif"><text x="28" y="37" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">HANSON HOME / BOMBAS DE CALOR</text><text x="28" y="88" fill="#302d29" font-size="32.00" text-anchor="start" font-weight="600">Ar separado. Calor em movimento.</text><rect x="28" y="140" width="272" height="235" rx="16" fill="#e8eff0" stroke="#d1c8b9"/><rect x="460" y="140" width="272" height="235" rx="16" fill="#f4e8db" stroke="#d1c8b9"/><text x="164" y="183" fill="#326c86" font-size="24.00" text-anchor="middle" font-weight="600">EXTERIOR</text><text x="164" y="230" fill="#302d29" font-size="24.00" text-anchor="middle" font-weight="400">Ar externo</text><text x="164" y="263" fill="#302d29" font-size="24.00" text-anchor="middle" font-weight="400">↓</text><text x="164" y="296" fill="#302d29" font-size="18.00" text-anchor="middle" font-weight="400">Serpentina externa</text><text x="164" y="329" fill="#302d29" font-size="24.00" text-anchor="middle" font-weight="400">absorve calor</text><text x="596" y="183" fill="#a34f2e" font-size="24.00" text-anchor="middle" font-weight="600">SUA CASA</text><text x="596" y="230" fill="#302d29" font-size="18.00" text-anchor="middle" font-weight="400">Serpentina interna</text><text x="596" y="263" fill="#302d29" font-size="24.00" text-anchor="middle" font-weight="400">↓</text><text x="596" y="296" fill="#302d29" font-size="21.50" text-anchor="middle" font-weight="400">Ar interno</text><text x="596" y="329" fill="#302d29" font-size="24.00" text-anchor="middle" font-weight="400">recebe calor</text><line x1="315" y1="205" x2="445" y2="205" stroke="#a34f2e" stroke-width="4"/><path d="M -10 -6 L 0 0 L -10 6" transform="translate(445 205) rotate(0)" fill="none" stroke="#a34f2e" stroke-width="4"/><text x="380" y="245" fill="#65594b" font-size="20.00" text-anchor="middle" font-weight="400">Compressor</text><text x="380" y="274" fill="#65594b" font-size="20.00" text-anchor="middle" font-weight="400">eleva</text><text x="380" y="303" fill="#65594b" font-size="20.00" text-anchor="middle" font-weight="400">temperatura</text><line x1="445" y1="348" x2="315" y2="348" stroke="#326c86" stroke-width="4"/><path d="M -10 -6 L 0 0 L -10 6" transform="translate(315 348) rotate(180)" fill="none" stroke="#326c86" stroke-width="4"/><text x="380" y="410" fill="#65594b" font-size="24.00" text-anchor="middle" font-weight="400">A expansão reduz a pressão.</text><text x="380" y="443" fill="#65594b" font-size="24.00" text-anchor="middle" font-weight="400">Retorna à serpentina externa.</text><text x="380" y="494" fill="#302d29" font-size="21.00" text-anchor="middle" font-weight="400">Aquecimento · circuito selado</text><text x="28" y="538" fill="#65594b" font-size="17.00" text-anchor="start" font-weight="400">Ilustração educativa original · Hanson Home</text></g></svg>