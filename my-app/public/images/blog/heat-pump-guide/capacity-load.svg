<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc"><title id="title">Winter capacity has to meet the home load.</title><desc id="desc">Hypothetical heat loss and equipment output versus temperature. At an example 5°F design point, home load is 30,000 BTU/h, system A is 34,000 and system B is 24,000. The curves are illustrative, not measurements.</desc><rect width="760" height="560" rx="22" fill="#faf8f5"/><g font-family="Arial, sans-serif"><text x="28" y="37" fill="#65594b" font-size="18" text-anchor="start" font-weight="400">HANSON HOME  /  HEAT PUMPS, EXPLAINED</text><text x="28" y="84" fill="#302d29" font-size="32" text-anchor="start" font-weight="400">Can the output meet the load?</text><text x="83" y="152" fill="#65594b" font-size="18" text-anchor="start" font-weight="400">BTU/h (thousands)</text><line x1="83" y1="353" x2="722" y2="353" stroke="#d1c8b9" stroke-width="2"/><text x="73" y="359" fill="#65594b" font-size="18" text-anchor="end" font-weight="400">10</text><line x1="83" y1="292" x2="722" y2="292" stroke="#d1c8b9" stroke-width="2"/><text x="73" y="298" fill="#65594b" font-size="18" text-anchor="end" font-weight="400">20</text><line x1="83" y1="231" x2="722" y2="231" stroke="#d1c8b9" stroke-width="2"/><text x="73" y="237" fill="#65594b" font-size="18" text-anchor="end" font-weight="400">30</text><line x1="83" y1="170" x2="722" y2="170" stroke="#d1c8b9" stroke-width="2"/><text x="73" y="176" fill="#65594b" font-size="18" text-anchor="end" font-weight="400">40</text><line x1="83" y1="414" x2="722" y2="414" stroke="#302d29" stroke-width="2"/><line x1="205.8846153846154" y1="170" x2="205.8846153846154" y2="414" stroke="#65594b" stroke-width="2" stroke-dasharray="5 6"/><polyline points="83,200.5 205.8846153846154,231 353.34615384615387,273.70000000000005 722,359.1" fill="none" stroke="#302d29" stroke-width="4"/><polyline points="83,212.70000000000002 205.8846153846154,206.6 353.34615384615387,194.4 722,182.20000000000002" fill="none" stroke="#3e6c59" stroke-width="4"/><polyline points="83,298.1 205.8846153846154,267.6 353.34615384615387,237.1 722,212.70000000000002" fill="none" stroke="#a34f2e" stroke-width="4" stroke-dasharray="8 5"/><text x="83" y="444" fill="#302d29" font-size="18" text-anchor="middle" font-weight="400">-5°F</text><text x="205.8846153846154" y="444" fill="#302d29" font-size="18" text-anchor="middle" font-weight="400">5°F</text><text x="353.34615384615387" y="444" fill="#302d29" font-size="18" text-anchor="middle" font-weight="400">17°F</text><text x="722" y="444" fill="#302d29" font-size="18" text-anchor="middle" font-weight="400">47°F</text><circle cx="205.8846153846154" cy="206.6" r="6" fill="#3e6c59"/><circle cx="205.8846153846154" cy="231" r="6" fill="#302d29"/><circle cx="205.8846153846154" cy="267.6" r="6" fill="#a34f2e"/><text x="83" y="474" fill="#65594b" font-size="19" text-anchor="start" font-weight="400">← colder outdoors</text><line x1="28" y1="491" x2="46" y2="491" stroke="#302d29" stroke-width="4"/><text x="54" y="497" fill="#302d29" font-size="20" text-anchor="start" font-weight="400">Home load: 30k</text><line x1="270" y1="491" x2="288" y2="491" stroke="#3e6c59" stroke-width="4"/><text x="296" y="497" fill="#3e6c59" font-size="20" text-anchor="start" font-weight="400">System A: 34k</text><line x1="512" y1="491" x2="530" y2="491" stroke="#a34f2e" stroke-width="4"/><text x="538" y="497" fill="#a34f2e" font-size="20" text-anchor="start" font-weight="400">System B: 24k</text><text x="83" y="126" fill="#65594b" font-size="20" text-anchor="start" font-weight="400">Example design point: 5°F</text><text x="28" y="538" fill="#65594b" font-size="17" text-anchor="start" font-weight="400">Original educational illustration · Hanson Home</text></g></svg>