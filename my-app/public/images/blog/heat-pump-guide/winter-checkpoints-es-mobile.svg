<svg xmlns="http://www.w3.org/2000/svg" width="460" height="650" viewBox="0 0 460 650" lang="es" role="img" aria-labelledby="title desc"><title id="title">Puntos de revisión invernal: congelación y deshielo, datos a 17°F y 5°F y límites bajo cero de cada modelo.</title><desc id="desc">Son preguntas para distintas temperaturas, no una curva de rendimiento ni una temperatura de diseño estatal.</desc><rect width="460" height="650" rx="22" fill="#faf8f5"/><g font-family="Arial, sans-serif"><text x="28" y="37" fill="#65594b" font-size="16.00" text-anchor="start" font-weight="400">HANSON HOME / BOMBAS DE CALOR</text><text x="28" y="85" fill="#302d29" font-size="28.00" text-anchor="start" font-weight="400">Use temperaturas</text><text x="28" y="122" fill="#302d29" font-size="19.60" text-anchor="start" font-weight="400">como puntos de revisión.</text><rect x="28" y="145" width="404" height="98" rx="16" fill="#e8eff0" stroke="#d1c8b9"/><text x="48" y="200" fill="#302d29" font-size="28.00" text-anchor="start" font-weight="600">32°F</text><text x="147" y="176" fill="#302d29" font-size="18.00" text-anchor="start" font-weight="600">Congelación</text><text x="147" y="204" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">Escarcha y deshielo</text><text x="147" y="231" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">pueden importar.</text><rect x="28" y="254" width="404" height="98" rx="16" fill="#f4e8db" stroke="#d1c8b9"/><text x="48" y="309" fill="#302d29" font-size="28.00" text-anchor="start" font-weight="600">17°F</text><text x="147" y="285" fill="#302d29" font-size="18.00" text-anchor="start" font-weight="600">Datos en frío</text><text x="147" y="313" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">Compare capacidad</text><text x="147" y="340" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">y eficiencia.</text><rect x="28" y="363" width="404" height="98" rx="16" fill="#e8eff0" stroke="#d1c8b9"/><text x="48" y="418" fill="#302d29" font-size="28.00" text-anchor="start" font-weight="600">5°F</text><text x="147" y="394" fill="#302d29" font-size="18.00" text-anchor="start" font-weight="600">Prueba de clima frío</text><text x="147" y="422" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">Revise capacidad</text><text x="147" y="449" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">y COP por separado.</text><rect x="28" y="472" width="404" height="98" rx="16" fill="#f4e8db" stroke="#d1c8b9"/><text x="48" y="527" fill="#302d29" font-size="28.00" text-anchor="start" font-weight="600">&lt; 0°F</text><text x="147" y="503" fill="#302d29" font-size="18.00" text-anchor="start" font-weight="600">Límites del modelo</text><text x="147" y="531" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">Verifique capacidad y</text><text x="147" y="558" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">plan para frío extremo.</text><text x="28" y="628" fill="#65594b" font-size="15.00" text-anchor="start" font-weight="400">Ilustración educativa original · Hanson Home</text></g></svg>