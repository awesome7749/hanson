<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc"><title id="title">Match output to the heating job.</title><desc id="desc">Conceptual comparison: a single-speed unit repeatedly cycles at full output; a variable-speed system can adjust output toward a changing load within its limits. This is not measured savings data.</desc><rect width="760" height="560" rx="22" fill="#faf8f5"/><g font-family="Arial, sans-serif"><text x="28" y="37" fill="#65594b" font-size="18" text-anchor="start" font-weight="400">HANSON HOME  /  HEAT PUMPS, EXPLAINED</text><text x="28" y="85" fill="#302d29" font-size="32" text-anchor="start" font-weight="400">The compressor can change pace.</text><text x="55" y="142" fill="#302d29" font-size="24" text-anchor="start" font-weight="600">Full output / off</text><line x1="55" y1="260" x2="725" y2="260" stroke="#302d29" stroke-width="2"/><line x1="55" y1="166" x2="55" y2="260" stroke="#302d29" stroke-width="2"/><line x1="55" y1="224" x2="725" y2="211" stroke="#326c86" stroke-width="2" stroke-dasharray="7 6"/><polyline points="55,260 55,166 122,166 122,260 189,260 189,260 189,166 256,166 256,260 323,260 323,260 323,166 390,166 390,260 457,260 457,260 457,166 524,166 524,260 591,260 591,260 591,166 658,166 658,260 725,260" stroke="#a34f2e" fill="none" stroke-width="4"/><text x="725" y="286" fill="#65594b" font-size="18" text-anchor="end" font-weight="400">time →</text><text x="55" y="304" fill="#302d29" font-size="24" text-anchor="start" font-weight="600">Variable output</text><line x1="55" y1="422" x2="725" y2="422" stroke="#302d29" stroke-width="2"/><line x1="55" y1="328" x2="55" y2="422" stroke="#302d29" stroke-width="2"/><line x1="55" y1="386" x2="725" y2="373" stroke="#326c86" stroke-width="2" stroke-dasharray="7 6"/><path d="M 55 388 C 278.33333333333337 383 501.6666666666667 379 725 373" fill="none" stroke="#3e6c59" stroke-width="5"/><text x="725" y="448" fill="#65594b" font-size="18" text-anchor="end" font-weight="400">time →</text><text x="28" y="501" fill="#326c86" font-size="22" text-anchor="start" font-weight="400">Dashed line: illustrative home heating need</text><text x="28" y="538" fill="#65594b" font-size="17" text-anchor="start" font-weight="400">Original educational illustration · Hanson Home</text></g></svg>