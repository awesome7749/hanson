<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" lang="zh-Hans" role="img" aria-labelledby="title desc"><title id="title">示例 COP 3：一份电能加两份室外热量，等于三份输出热量。</title><desc id="desc">COP 3 的能量平衡示例。实际 COP 随天气、工况和安装系统变化。</desc><rect width="760" height="560" rx="22" fill="#faf8f5"/><g font-family="Arial, sans-serif"><text x="28" y="37" fill="#65594b" font-size="18.00" text-anchor="start" font-weight="400">HANSON HOME / 热泵原理</text><text x="28" y="85" fill="#302d29" font-size="32.00" text-anchor="start" font-weight="400">COP 为 3 时，输入与输出相加。</text><rect x="28" y="163" width="218" height="210" rx="16" fill="#faf8f5" stroke="#d1c8b9"/><text x="137" y="256" fill="#302d29" font-size="64.00" text-anchor="middle" font-weight="600">1</text><text x="137" y="312" fill="#302d29" font-size="23.00" text-anchor="middle" font-weight="400">电能</text><rect x="271" y="163" width="218" height="210" rx="16" fill="#e8eff0" stroke="#d1c8b9"/><text x="380" y="256" fill="#326c86" font-size="64.00" text-anchor="middle" font-weight="600">2</text><text x="380" y="312" fill="#326c86" font-size="23.00" text-anchor="middle" font-weight="400">室外热量</text><rect x="514" y="163" width="218" height="210" rx="16" fill="#f4e8db" stroke="#d1c8b9"/><text x="623" y="256" fill="#a34f2e" font-size="64.00" text-anchor="middle" font-weight="600">3</text><text x="623" y="312" fill="#a34f2e" font-size="23.00" text-anchor="middle" font-weight="400">输出热量</text><text x="259" y="267" fill="#302d29" font-size="28.00" text-anchor="middle" font-weight="400">+</text><text x="502" y="267" fill="#302d29" font-size="28.00" text-anchor="middle" font-weight="400">=</text><text x="28" y="452" fill="#65594b" font-size="23.00" text-anchor="start" font-weight="400">仅为示例，实际 COP 随工况变化。</text><text x="28" y="538" fill="#65594b" font-size="17.00" text-anchor="start" font-weight="400">原创教学图示 · Hanson Home</text></g></svg>